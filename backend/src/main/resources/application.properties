spring.application.name=BizFlow Backend

# --- Server Config ---
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=on_param

# =========================================================
# CAU HINH DATABASE DUNG CHUNG (TiDB CLOUD)
# =========================================================
# URL ket noi: Host + Port 4000 + Database 'test1' + SSL
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&useSSL=true&allowPublicKeyRetrieval=true
# Username
spring.datasource.username=2W9Zd4XS2k191K1.root

# Password
spring.datasource.password=vqhltrsHAtdps05K

# Driver & Pool Config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000

# --- JPA / Hibernate ---
# CHI SU DUNG FLYWAY DE QUAN LY SCHEMA. Hibernate chi validate.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway ---
# Bat Flyway de quan ly schema va du lieu tu cac file .sql
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Fix error 'Detected applied migration not resolved locally: 8'
spring.flyway.ignore-migration-patterns=*:missing


# --- JWT Configuration ---
jwt.secret=TXlTdXBlclNlY3JldEtleUZvckJpekZsb3dQcm9qZWN0MjAyNXZlcnlMb25nU3RyaW5nToMakeItWork==
jwt.expiration=86400000
jwt.refresh-token-expiration=604800000

# --- Redis Configuration (Van chay Localhost) ---
# Luu y: Nho bat Redis tren may tinh cua ban len nhe
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms

# --- Logging ---
logging.level.root=INFO
logging.level.com.bizflow=DEBUG
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# --- Encoding ---
server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

spring.data.web.page-serialization-mode=VIA_DTO