spring.application.name=BizFlow Backend

# --- Server Config ---
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=on_param

# =========================================================
# CAU HINH DATABASE (TiDB CLOUD)
# =========================================================
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&useSSL=true&allowPublicKeyRetrieval=true
spring.datasource.username=2W9Zd4XS2k191K1.root
spring.datasource.password=vqhltrsHAtdps05K
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Pool Config
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000

# =========================================================
# JPA / HIBERNATE (C?c k? an toàn - Ch? ki?m tra c?u hình)
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================================================
# FLYWAY - FIX LOI NHUNG GIU NGUYEN DU LIEU
# =========================================================
spring.flyway.enabled=true

# 1. T?t ch? ?? validate: Ng?n Flyway d?ng App khi th?y thi?u file (V8, V11) ho?c sai checksum
spring.flyway.validate-on-migrate=false

# 2. T? ??ng s?a l?i: C?p nh?t l?i tr?ng thái thành công cho b?ng l?ch s? migration
spring.flyway.repair-on-migrate=true

# 3. B? qua các file m?t tích: Không báo l?i n?u DB ?ã ch?y script mà local không có file
spring.flyway.ignore-missing-migrations=true
spring.flyway.ignore-migration-patterns=*:missing

# 4. Baseline: Giúp Flyway ti?p t?c ch?y t? tr?ng thái hi?n t?i c?a DB
spring.flyway.baseline-on-migrate=true

# =========================================================
# SECURITY & JWT
